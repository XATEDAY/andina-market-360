name: Pruebas reutilizables
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python src/resumen.py --json docs/data/resumen.json
      - run: git diff --exit-code -- docs/data/resumen.json
      - uses: actions/upload-artifact@v4
        with:
          name: resumen-python-${{ inputs.python-version }}
          path: docs/data/resumen.json
          retention-days: 3
