name: CI de ventas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    uses: ./.github/workflows/pruebas.yml
    with:
      python-version: ${{ matrix.python-version }}
